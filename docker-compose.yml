services:
  leoai:
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre}
        JAR_URL: ${JAR_URL:-https://github.com/cha0upup/LeoAI/releases/download/v2.1.0/LeoAi-2.1.0.jar}
    image: leoai:local
    container_name: leoai
    restart: unless-stopped
    ports:
      - "${LEOAI_PORT:-8082}:8082"
    environment:
      LEO_PLUGIN_ENCRYPT_KEY: ${LEO_PLUGIN_ENCRYPT_KEY:-ikunikunikunikun}
      LEO_DATABASE_MASTER_KEY: ${LEO_DATABASE_MASTER_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/data.db
      VFSPATH: /app/data/root
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - leoai-data:/app/data

volumes:
  leoai-data:
