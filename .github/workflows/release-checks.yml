name: Release checks

on:
  workflow_dispatch:
    inputs:
      frontend_repository:
        description: 'Frontend repository (owner/repository)'
        required: true
        type: string
      frontend_ref:
        description: 'Exact 40-character frontend commit SHA matching bundled assets'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: backend
          persist-credentials: false
      - name: Validate frontend identity
        env:
          FRONTEND_REPOSITORY: ${{ inputs.frontend_repository }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['FRONTEND_REPOSITORY']):
              raise SystemExit('Expected owner/repository')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['FRONTEND_REF']):
              raise SystemExit('An exact frontend commit SHA is required')
          PY
      - name: Checkout matching frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.frontend_repository }}
          ref: ${{ inputs.frontend_ref }}
          path: frontend
          token: ${{ secrets.FRONTEND_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up component and application JDKs
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: |
            8
            17
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare PHP test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
      - name: Verify release inputs and package
        run: |
          export JAVA8_HOME="${JAVA_HOME_8_X64:?Java 8 installation is required}"
          python3 backend/tools/verify_release.py --frontend "$GITHUB_WORKSPACE/frontend"
